name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    name: 构建与测试
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原 NuGet 包
        run: dotnet restore

      - name: 构建
        run: dotnet build MouseClicker.sln --configuration Release -warnaserror

      - name: 运行测试
        run: dotnet test MouseClicker.sln --configuration Release --no-build
