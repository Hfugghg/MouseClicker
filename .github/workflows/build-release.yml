name: 构建并发布 .NET 应用

on:
  push:
    tags:
      - 'v*' # 触发条件：推送任何以 'v' 开头的标签

# 为工作流作业设置权限，允许它向仓库写入内容（创建Release）
permissions:
  contents: write

jobs:
  build-release:
    name: 构建和发布
    # 使用最新的 Windows 环境来构建，因为这是个 Windows 应用
    runs-on: windows-latest

    steps:
      # 第一步：检出你的仓库代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 第二步：安装指定版本的 .NET SDK
      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # 根据你项目 csproj 文件中的 TargetFramework 设置

      # 第三步：还原项目的 NuGet 包依赖
      - name: 还原 NuGet 包
        # 修正路径：直接在根目录找到 csproj 文件
        run: dotnet restore ./MouseClicker.csproj

      # --- 构建绿色免安装版 (Framework-Dependent) ---
      - name: 构建绿色免安装版
        # 修正路径
        run: dotnet publish ./MouseClicker.csproj --configuration Release --runtime win-x64 --self-contained false --output ./release-portable

      - name: 打包绿色免安装版
        run: Compress-Archive -Path ./release-portable/* -DestinationPath MouseClicker-Portable-${{ github.ref_name }}.zip

      # --- 构建独立安装版 (Self-Contained Single File) ---
      - name: 构建独立安装版
        # 修正路径
        run: dotnet publish ./MouseClicker.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true --output ./release-installer

      - name: 重命名独立安装包
        run: Rename-Item -Path ./release-installer/MouseClicker.exe -NewName MouseClicker-Installer-${{ github.ref_name }}.exe

      # --- 创建 Release 并上传构建产物 ---
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MouseClicker-Portable-${{ github.ref_name }}.zip
            ./release-installer/MouseClicker-Installer-${{ github.ref_name }}.exe
          name: "Release ${{ github.ref_name }}"
          prerelease: false