name: 构建并发布 .NET 应用

on:
  push:
    tags:
      - 'v*' # 触发条件：推送任何以 'v' 开头的标签

permissions:
  contents: write

jobs:
  build-release:
    name: 构建和发布
    runs-on: windows-latest

    steps:
      # 第一步：检出你的仓库代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 第二步：安装指定版本的 .NET SDK
      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 第三步：还原项目的 NuGet 包依赖
      - name: 还原 NuGet 包
        run: dotnet restore ./MouseClicker.csproj

      # --- 构建绿色免安装版 (Framework-Dependent) ---
      - name: 构建绿色免安装版
        run: dotnet publish ./MouseClicker.csproj --configuration Release --runtime win-x64 --self-contained false --output ./release-portable

      - name: 打包绿色免安装版
        run: Compress-Archive -Path ./release-portable/* -DestinationPath MouseClicker-Portable-${{ github.ref_name }}.zip

      # --- 构建用于 Inno Setup 打包的独立文件集 ---
      - name: 构建用于安装包的文件
        # 注意：这里 self-contained 是 true，但 PublishSingleFile 是 false
        # 这会把所有依赖（包括.NET运行时）都输出到目录中，方便 Inno Setup 打包
        run: dotnet publish ./MouseClicker.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false --output ./release-for-inno

      # --- 使用 Inno Setup 创建高压安装包 ---
      - name: 安装 Inno Setup
        uses: jrgo/setup-inno-setup-action@v1

      - name: 编译 Inno Setup 安装包
        # 调用 Inno Setup 命令行编译器 iscc.exe
        # /DAppVersion 将 GitHub 的标签名（如 v1.0.1）传递给 setup.iss 脚本
        # /O+ 指定输出目录
        run: |
          iscc.exe "setup.iss" /DAppVersion="${{ github.ref_name }}" /O+"./output"

      # --- 创建 Release 并上传构建产物 ---
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MouseClicker-Portable-${{ github.ref_name }}.zip
            ./output/MouseClicker-Setup-${{ github.ref_name }}.exe
          name: "Release ${{ github.ref_name }}"
          prerelease: false