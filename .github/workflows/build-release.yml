name: 构建并发布 .NET 应用

on:
  push:
    tags:
      - 'v*' # 触发条件：推送任何以 'v' 开头的标签

permissions:
  contents: write

jobs:
  build-release:
    name: 构建和发布
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原 NuGet 包
        run: dotnet restore ./MouseClicker.csproj

      - name: 构建绿色免安装版
        run: dotnet publish ./MouseClicker.csproj --configuration Release --runtime win-x64 --self-contained false --output ./release-portable

      - name: 打包绿色免安装版
        run: Compress-Archive -Path ./release-portable/* -DestinationPath MouseClicker-Portable-${{ github.ref_name }}.zip

      - name: 构建用于安装包的文件
        run: dotnet publish ./MouseClicker.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false --output ./release-for-inno

      # --- 使用 Inno Setup 创建高压安装包 ---
      - name: 在 Inno Setup 脚本中设置版本号
        # 直接替换脚本文件中的占位符
        run: |
          (Get-Content -path "setup.iss" -Raw) -replace '__APP_VERSION__', "${{ github.ref_name }}" | Set-Content -path "setup.iss"

      - name: [调试] 显示替换后的脚本内容
        # 这个步骤会打印出脚本内容，让我们可以在日志中确认替换是否成功
        run: |
          echo "--- Content of setup.iss before compiling ---"
          Get-Content -path "setup.iss"
          echo "-------------------------------------------"
        shell: pwsh

      - name: 编译 Inno Setup 安装包
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: setup.iss

      # --- 创建 Release 并上传构建产物 ---
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MouseClicker-Portable-${{ github.ref_name }}.zip
            ./output/MouseClicker-Setup-${{ github.ref_name }}.exe
          name: "Release ${{ github.ref_name }}"
          prerelease: false